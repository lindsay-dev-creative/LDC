<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Susan Jones Esig</title>
<style>
  /* Lora SemiBold (name) and Regular (title), self-hosted from this repo.
     Apple Mail and iPhone load them; Gmail and Outlook fall back to Georgia. */
  @font-face {
    font-family:'Lora';
    font-style:normal;
    font-weight:600;
    font-display:swap;
    src:url('https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/fonts/Lora-SemiBold.ttf') format('truetype');
  }
  @font-face {
    font-family:'Lora';
    font-style:normal;
    font-weight:400;
    font-display:swap;
    src:url('https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/fonts/Lora-Regular.ttf') format('truetype');
  }
  @media only screen and (max-width: 480px) {
    .sig-stack { display:block !important; width:100% !important; }
    .sig-headshot-cell { padding:0 0 16px 0 !important; }
    .sig-info-cell { padding:0 !important; }
  }
  .sig-dark { display:none; }
  @media (prefers-color-scheme: dark) {
    .sig-page { background:#1e1e1e !important; }
    .sig-card { background:transparent !important; }
    .sig-name, .sig-link { color:#ededed !important; }
    .sig-divider { border-top-color:#4d4d4d !important; }
    .sig-light { display:none !important; }
    .sig-dark { display:block !important; max-height:none !important; }
  }
  /* Outlook.com and Outlook mobile dark mode */
  [data-ogsc] .sig-name, [data-ogsc] .sig-link { color:#ededed !important; }
  [data-ogsc] .sig-light, [data-ogsb] .sig-light { display:none !important; }
  [data-ogsc] .sig-dark, [data-ogsb] .sig-dark { display:block !important; max-height:none !important; }
</style>
</head>
<body class="sig-page" style="margin:0;padding:32px;background:#ededed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">

<!--
  EMAIL SIGNATURE - Susan Jones - Lindsay Dev Creative
  All images are hosted from this repo (public) and load over https:
    icons/   contact + social icons, light and dark variants
    imgs/    headshots
    logos/   circular wordmark (PNG for email; SVG source alongside it)
  Light/dark swapping uses .sig-light / .sig-dark. Apple Mail and iPhone
  Mail follow prefers-color-scheme; Outlook.com/mobile use [data-ogsc].
  Gmail ignores both and always shows the .sig-light set, so those PNGs
  are black art with a thin white halo that stays visible when Gmail
  darkens the background. .sig-dark images are hidden inline too, since
  Gmail strips <style>. SVG sources for every icon sit next to the PNGs.
-->

<table class="sig-card" role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;background:#ffffff;">
  <tr>
    <td colspan="2" style="padding:0 0 24px 0;">
      <div class="sig-divider" style="border-top:1px solid #b8b8b8;min-width:290px;font-size:0;line-height:0;">&nbsp;</div>
    </td>
  </tr>
  <tr class="sig-stack-row">
    <!-- Headshot -->
    <td class="sig-stack sig-headshot-cell" style="padding:0 24px 0 0;vertical-align:top;">
      <a href="https://www.lindsaydevcreative.com/" style="display:inline-block;line-height:0;text-decoration:none;">
              <img class="sig-light" src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/logos/ldc-logo-circle.png" alt="Lindsay Dev Creative" width="60" height="60" style="display:block;width:60px;height:60px;border:0;">
              <img class="sig-dark" src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/logos/ldc-logo-circle-white.png" alt="Lindsay Dev Creative" width="60" height="60" style="display:none;mso-hide:all;max-height:0;overflow:hidden;width:60px;height:60px;border:0;">
            </a>
    </td>

    <!-- Info + logo -->
    <td class="sig-stack sig-info-cell" style="padding:0;vertical-align:top;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <!-- Info column -->
          <td style="vertical-align:top;padding-right:4px;">

            <!-- Name block -->
            <div style="padding-bottom:10px;">
              <div class="sig-name" style="font-family:'Lora',Georgia,'Times New Roman',serif;font-size:24px;font-weight:600;color:#0a0a0a;letter-spacing:-0.01em;line-height:1.25em;">
                Susan Jones
              </div>
              <div style="font-family:'Lora',Georgia,'Times New Roman',serif;font-size:14px;font-weight:400;color:#d4a85a;letter-spacing:0em;margin-top:3px;line-height:1.5;">
                Chief Operating Officer
              </div>
            </div>

            <!-- Contact block -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-size:13px;line-height:1.7;">
              <tr>
                <td style="padding:0 8px 0 2px;vertical-align:middle;line-height:1;">
                  <img src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/icons/icon-globe.png"
                       alt="" width="14" height="14"
                       class="sig-light" style="display:block;width:14px;height:14px;border:0;">
                  <img src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/icons/icon-globe-white.png"
                       alt="" width="14" height="14"
                       class="sig-dark" style="display:none;mso-hide:all;max-height:0;overflow:hidden;width:14px;height:14px;border:0;">
                </td>
                <td style="vertical-align:middle;">
                  <a href="https://www.lindsaydevcreative.com/"
                     class="sig-link" style="color:#1a1a1a;text-decoration:none;font-weight:400;">lindsaydevcreative.com</a>
                </td>
              </tr>
              <tr>
                <td style="padding:0 8px 0 2px;vertical-align:middle;line-height:1;">
                  <img src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/icons/icon-email.png"
                       alt="" width="14" height="14"
                       class="sig-light" style="display:block;width:14px;height:14px;border:0;">
                  <img src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/icons/icon-email-white.png"
                       alt="" width="14" height="14"
                       class="sig-dark" style="display:none;mso-hide:all;max-height:0;overflow:hidden;width:14px;height:14px;border:0;">
                </td>
                <td style="vertical-align:middle;">
                  <a class="sig-link" href="mailto:accounting@lindsaydev.com"
                     style="color:#0a0a0a;text-decoration:none;font-weight:400;">accounting@lindsaydev.com</a>
                </td>
              </tr>
            </table>

            <!-- Social icons -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:12px;">
              <tr>
                <td style="padding-right:6px;vertical-align:middle;">
                  <a href="https://www.linkedin.com/in/lindsaydevcreative/" style="text-decoration:none;display:inline-block;line-height:0;">
                    <img src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/icons/linkedin.png"
                         alt="LinkedIn" width="16" height="16"
                         class="sig-light" style="display:block;width:16px;height:16px;border:0;">
                    <img src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/icons/linkedin-white.png"
                         alt="LinkedIn" width="16" height="16"
                         class="sig-dark" style="display:none;mso-hide:all;max-height:0;overflow:hidden;width:16px;height:16px;border:0;">
                  </a>
                </td>
                <td style="padding-right:6px;vertical-align:middle;">
                  <a href="https://www.instagram.com/?hl=en" style="text-decoration:none;display:inline-block;line-height:0;">
                    <img src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/icons/instagram.png"
                         alt="Instagram" width="16" height="16"
                         class="sig-light" style="display:block;width:16px;height:16px;border:0;">
                    <img src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/icons/instagram-white.png"
                         alt="Instagram" width="16" height="16"
                         class="sig-dark" style="display:none;mso-hide:all;max-height:0;overflow:hidden;width:16px;height:16px;border:0;">
                  </a>
                </td>
                <td style="vertical-align:middle;">
                  <a href="https://www.facebook.com/lindsaydevcreative" style="text-decoration:none;display:inline-block;line-height:0;">
                    <img src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/icons/facebook.png"
                         alt="Facebook" width="16" height="16"
                         class="sig-light" style="display:block;width:16px;height:16px;border:0;">
                    <img src="https://raw.githubusercontent.com/lindsay-dev-creative/ldc/main/icons/facebook-white.png"
                         alt="Facebook" width="16" height="16"
                         class="sig-dark" style="display:none;mso-hide:all;max-height:0;overflow:hidden;width:16px;height:16px;border:0;">
                  </a>
                </td>
              </tr>
            </table>

          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

</body>
</html>
